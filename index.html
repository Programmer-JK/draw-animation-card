<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>캐릭터 카드 뽑기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Jua&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <header>
    <h1>캐릭터 카드 뽑기</h1>
    <p>게임 전 플레이어를 설정하세요</p>
  </header>

  <div class="setup-box">
    <h2>플레이어 설정</h2>

    <div class="setup-input-row">
      <input type="text" id="setupInput" placeholder="플레이어 이름 입력" maxlength="12" />
      <button class="btn-add-setup" onclick="setupAddMember()">추가</button>
    </div>

    <div class="setup-member-list" id="setupMemberList">
      <div class="setup-empty">아직 플레이어가 없어요</div>
    </div>

    <div class="setup-divider">게임 설정</div>

    <div class="setup-section-label-row">
      <div class="setup-section-label">모드</div>
      <button class="mode-guide-btn" onclick="openModeGuide()">
        <i data-lucide="book-open" style="width:12px;height:12px;"></i>
        설명서
      </button>
    </div>
    <div class="setup-mode-chips">
      <button class="setup-mode-chip active" data-mode="basic" onclick="selectMode('basic')">기본</button>
      <button class="setup-mode-chip" data-mode="genre" onclick="selectMode('genre')">장르</button>
    </div>

    <button class="setup-infinite-btn" id="infiniteBtn" onclick="toggleInfiniteSetup()">
      <span class="infinite-symbol">∞</span>
      <span class="infinite-label">무한 모드</span>
      <span class="infinite-desc">카드 중복 허용</span>
    </button>

    <button class="btn-start-game" id="btnStartGame" onclick="startGame()">게임 시작</button>
  </div>

  <!-- 모드 설명서 모달 -->
  <div class="mode-guide-overlay" id="modeGuideOverlay" onclick="closeModeGuide(event)">
    <div class="mode-guide-book">
      <div class="mode-guide-header">
        <span class="mode-guide-title">게임 모드 안내</span>
        <button class="mode-guide-close" onclick="closeModeGuide()">
          <i data-lucide="x" style="width:15px;height:15px;"></i>
        </button>
      </div>
      <div class="mode-guide-body">
        <div class="mode-guide-item">
          <div class="mode-guide-item-head">
            <span class="mode-guide-badge basic">기본</span>
          </div>
          <p class="mode-guide-desc">6개의 카드가 한 번에 랜덤으로 공개됩니다.<br>의상·전투방식·장르·스타일·성격·특징 중 무작위로 선택된 6가지 속성이 당신의 캐릭터를 만들어요.</p>
        </div>
        <div class="mode-guide-divider"></div>
        <div class="mode-guide-item">
          <div class="mode-guide-item-head">
            <span class="mode-guide-badge genre">장르</span>
          </div>
          <p class="mode-guide-desc">카테고리 버튼을 직접 눌러서 원하는 속성을 하나씩 공개합니다.<br>어떤 카테고리에서 카드를 받을지 내가 직접 선택할 수 있어요.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>

</html>
