<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>캐릭터 카드 뽑기</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Black+Han+Sans&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #1a1a2e;
      --accent1: #e8c97a;
      --accent2: #c96a8f;
      --accent3: #6a9fc9;
      --accent4: #8fc96a;
      --accent5: #c9906a;
      --accent6: #a06ac9;
      --text: #f0ead6;
      --border: rgba(232, 201, 122, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      /* 모바일 터치 하이라이트 제거 */
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif KR', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0 10px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1.5rem;
    }

    header h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.2rem;
      /* 모바일 대응 크기 조절 */
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .draw-btn {
      background: transparent;
      border: 1.5px solid var(--accent1);
      color: var(--accent1);
      padding: 0.8rem 2rem;
      font-family: 'Black Han Sans', sans-serif;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 2rem;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      border-radius: 4px;
    }

    .draw-btn:active {
      /* 모바일 클릭 피드백 */
      background: var(--accent1);
      color: var(--bg);
      transform: scale(0.95);
    }

    .cards-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      /* 카드간 간격 밀착 */
      width: 100%;
      max-width: 650px;
      /* 3장이 너무 벌어지지 않게 제한 */
      padding-bottom: 4rem;
    }

    .card-wrap {
      perspective: 1000px;
      width: calc(33.333% - 12px);
      /* 기본 3열 */
      min-width: 100px;
      /* 최소 너비 */
      aspect-ratio: 180 / 280;
      /* 카드 비율 고정 */
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-back {
      background: var(--card-bg);
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .card-back span {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.5rem;
      color: var(--accent1);
      opacity: 0.3;
    }

    .card-front {
      transform: rotateY(180deg);
      background: #12121a;
      z-index: 1;
    }

    .cat-bar {
      height: 5px;
      width: 100%;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
    }

    .card-category {
      font-size: 0.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
    }

    .card-icon {
      margin-bottom: 6px;
    }

    .card-icon svg {
      width: clamp(30px, 10vw, 40px);
      /* 화면 크기에 따른 아이콘 크기 유동 조절 */
      height: auto;
      stroke: currentColor;
    }

    .card-name {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(0.9rem, 4vw, 1.15rem);
      /* 이름 크기 유동 조절 */
      margin-bottom: 4px;
      word-break: keep-all;
    }

    .card-desc {
      font-size: 0.65rem;
      opacity: 0.6;
      line-height: 1.2;
      word-break: keep-all;
    }

    /* 카테고리별 테마색 */
    .cat-0 {
      color: var(--accent1);
    }

    .cat-0 .cat-bar {
      background: var(--accent1);
    }

    .cat-1 {
      color: var(--accent2);
    }

    .cat-1 .cat-bar {
      background: var(--accent2);
    }

    .cat-2 {
      color: var(--accent3);
    }

    .cat-2 .cat-bar {
      background: var(--accent3);
    }

    .cat-3 {
      color: var(--accent4);
    }

    .cat-3 .cat-bar {
      background: var(--accent4);
    }

    .cat-4 {
      color: var(--accent5);
    }

    .cat-4 .cat-bar {
      background: var(--accent5);
    }

    .cat-5 {
      color: var(--accent6);
    }

    .cat-5 .cat-bar {
      background: var(--accent6);
    }

    /* 📱 모바일 최적화 미디어 쿼리 */
    @media (max-width: 480px) {
      header h1 {
        font-size: 1.8rem;
      }

      .cards-area {
        gap: 8px;
      }

      .card-wrap {
        width: calc(50% - 8px);
        /* 모바일에서는 2열로 배치 */
      }

      /* 3번째 카드는 중앙 배치를 위해 100% 혹은 자동 조절 */
      .card-wrap:last-child:nth-child(odd) {
        width: calc(50% - 8px);
      }
    }

    @media (min-width: 600px) {
      header h1 {
        font-size: 2.8rem;
      }

      .card-wrap {
        width: 170px;
      }

      /* 태블릿 이상에서는 고정 크기 근접 */
      .cards-area {
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>캐릭터 카드 뽑기</h1>
    <p>3장의 카드로 조합하는 당신의 운명</p>
  </header>

  <button class="draw-btn" onclick="draw()">운명 뽑기</button>
  <div class="cards-area" id="cardsArea"></div>

  <script>
    const CATEGORIES = [
      {
        name: "의상", colorIdx: 0, items: [
          { name: "교복", desc: "청춘의 상징", icon: "graduation-cap" }, { name: "갑옷", desc: "철벽 방어", icon: "shield" },
          { name: "정장", desc: "단정한 실루엣", icon: "briefcase" }, { name: "한복", desc: "전통의 미", icon: "flower" },
          { name: "코트", desc: "고독한 분위기", icon: "shirt" }, { name: "운동복", desc: "활동적인 에너지", icon: "dumbbell" },
          { name: "수영복", desc: "여름의 추억", icon: "droplets" }, { name: "로브", desc: "신비로운 마력", icon: "sparkles" },
          { name: "드레스", desc: "화려한 우아함", icon: "star" }, { name: "제복", desc: "규율과 질서", icon: "award" }
        ]
      },
      {
        name: "전투방식", colorIdx: 1, items: [
          { name: "검술", desc: "날카로운 베기", icon: "sword" }, { name: "격투", desc: "묵직한 타격", icon: "hand" },
          { name: "마법", desc: "신비한 영창", icon: "wand-2" }, { name: "저격", desc: "정밀한 사격", icon: "crosshair" },
          { name: "소환", desc: "강력한 부름", icon: "dog" }, { name: "암살", desc: "어둠 속 일격", icon: "moon" },
          { name: "방어형", desc: "철벽의 가드", icon: "shield-alert" }, { name: "치유형", desc: "빛의 회복", icon: "heart-pulse" },
          { name: "독술", desc: "치명적인 한 방", icon: "skull" }, { name: "기계병기", desc: "압도적 화력", icon: "bot" }
        ]
      },
      {
        name: "장르", colorIdx: 2, items: [
          { name: "액션", desc: "폭발적 긴장감", icon: "zap" }, { name: "스포츠", desc: "땀과 열정", icon: "trophy" },
          { name: "공포", desc: "서늘한 공포", icon: "ghost" }, { name: "코믹", desc: "유쾌한 웃음", icon: "laugh" },
          { name: "로맨스", desc: "달콤한 설렘", icon: "heart" }, { name: "추리", desc: "진실의 추적", icon: "search" },
          { name: "판타지", desc: "꿈의 모험", icon: "mountain" }, { name: "일상", desc: "소소한 행복", icon: "coffee" },
          { name: "SF", desc: "미래의 상상", icon: "rocket" }, { name: "시대극", desc: "역사의 한 장면", icon: "scroll" }
        ]
      },
      {
        name: "스타일", colorIdx: 3, items: [
          { name: "시인", desc: "감성적 문장", icon: "feather" }, { name: "화가", desc: "색채의 마법", icon: "palette" },
          { name: "요리사", desc: "맛의 향연", icon: "utensils" }, { name: "의사", desc: "생명의 구원", icon: "stethoscope" },
          { name: "과학자", desc: "진리의 탐구", icon: "microscope" }, { name: "발명가", desc: "무한한 창조", icon: "lightbulb" },
          { name: "아이돌", desc: "무대의 중심", icon: "mic-2" }, { name: "탐정", desc: "날카로운 눈초리", icon: "glasses" },
          { name: "음악가", desc: "영혼의 울림", icon: "music" }, { name: "기사", desc: "명예의 수호", icon: "shield-check" }
        ]
      },
      {
        name: "성격", colorIdx: 4, items: [
          { name: "소심한", desc: "수줍은 마음", icon: "cloud" }, { name: "다정한", desc: "따뜻한 시선", icon: "sun" },
          { name: "까칠한", desc: "날카로운 말", icon: "zap" }, { name: "낯가리는", desc: "조심스러운 태도", icon: "eye-off" },
          { name: "장난꾸러기", desc: "즐거운 사고", icon: "party-popper" }, { name: "열정적인", desc: "뜨거운 에너지", icon: "flame" },
          { name: "집착하는", desc: "강한 집념", icon: "link" }, { name: "로맨틱한", desc: "낭만적 무드", icon: "rose" },
          { name: "냉정한", desc: "차가운 판단", icon: "snowflake" }, { name: "츤데레", desc: "숨겨진 진심", icon: "smile" }
        ]
      },
      {
        name: "특징", colorIdx: 5, items: [
          { name: "안경", desc: "지적 매력", icon: "glasses" }, { name: "문신", desc: "강렬한 표식", icon: "pen-tool" },
          { name: "흉터", desc: "전투의 흔적", icon: "scissors" }, { name: "반창고", desc: "소소한 상처", icon: "bandage" },
          { name: "귀걸이", desc: "빛나는 장식", icon: "circle" }, { name: "목걸이", desc: "소중한 펜던트", icon: "gem" },
          { name: "피어싱", desc: "개성적 감각", icon: "disc" }, { name: "가면", desc: "숨겨진 얼굴", icon: "mask" },
          { name: "이색 눈동자", desc: "신비로운 눈", icon: "eye" }, { name: "의수/의족", desc: "강철의 의지", icon: "armchair" }
        ]
      }
    ];

    function draw() {
      const area = document.getElementById('cardsArea');
      area.innerHTML = '';

      const selectedCats = [...CATEGORIES]
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      selectedCats.forEach((cat, idx) => {
        const item = cat.items[Math.floor(Math.random() * cat.items.length)];
        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';
        wrap.innerHTML = `
          <div class="card-inner" id="ci${idx}">
            <div class="card-face card-back"><span>?</span></div>
            <div class="card-face card-front cat-${cat.colorIdx}">
              <div class="cat-bar"></div>
              <div class="card-body">
                <div class="card-category">${cat.name}</div>
                <div class="card-icon"><i data-lucide="${item.icon}"></i></div>
                <div class="card-name">${item.name}</div>
                <div class="card-desc">${item.desc}</div>
              </div>
            </div>
          </div>
        `;
        area.appendChild(wrap);

        setTimeout(() => {
          const el = document.getElementById(`ci${idx}`);
          if (el) el.classList.add('flipped');
        }, 100 + (idx * 200));
      });

      lucide.createIcons();
    }
  </script>
</body>

</html>
