<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>캐릭터 카드 뽑기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Black+Han+Sans&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #1a1a2e;
      --accent1: #e8c97a;
      --accent2: #c96a8f;
      --accent3: #6a9fc9;
      --accent4: #8fc96a;
      --accent5: #c9906a;
      --accent6: #a06ac9;
      --text: #f0ead6;
      --border: rgba(232, 201, 122, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      /* 기본 폰트를 Sans KR로 변경하여 가독성 향상 */
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0 10px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 1.5rem 1rem 1rem;
    }

    header h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 5px;
      font-weight: 300;
      letter-spacing: -0.02em;
    }

    .draw-btn {
      background: transparent;
      border: 1.5px solid var(--accent1);
      color: var(--accent1);
      padding: 0.7rem 2rem;
      font-family: 'Black Han Sans', sans-serif;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      border-radius: 4px;
    }

    .draw-btn:active {
      background: var(--accent1);
      color: var(--bg);
    }

    .cards-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      width: 100%;
      max-width: 800px;
      padding-bottom: 4rem;
    }

    /* 카드 스타일 */
    .card-wrap {
      perspective: 1000px;
      width: 180px;
      height: 280px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-back {
      background: var(--card-bg);
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .card-back span {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 3.5rem;
      color: var(--accent1);
      opacity: 0.3;
    }

    .card-front {
      transform: rotateY(180deg);
      background: #12121a;
      z-index: 1;
    }

    .cat-bar {
      height: 6px;
      width: 100%;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
    }

    .card-cat-name {
      font-size: 0.65rem;
      opacity: 0.8;
      margin-bottom: 5px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .card-name {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    /* 얇고 선명하게 수정한 설명 폰트 */
    .card-desc {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.72rem;
      opacity: 0.9;
      font-weight: 300;
      /* 두께를 얇게 조절 */
      line-height: 1.4;
      letter-spacing: -0.01em;
      word-break: keep-all;
    }

    /* 플로팅 버튼 */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: var(--accent1);
      color: var(--bg);
      border: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.6rem;
    }

    /* 도감 오버레이 */
    .guide-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 10, 0.98);
      backdrop-filter: blur(15px);
      z-index: 200;
      display: none;
      padding: 20px;
      overflow-y: auto;
    }

    .guide-overlay.active {
      display: block;
    }

    .guide-content {
      max-width: 1100px;
      margin: 0 auto;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: transparent;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .guide-header h2 {
      font-family: 'Black Han Sans', sans-serif;
      color: var(--accent1);
      margin: 0;
      font-size: 1.5rem;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      cursor: pointer;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guide-section {
      margin-bottom: 50px;
    }

    .guide-section-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.3rem;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guide-section-desc {
      opacity: 0.8;
      font-size: 0.85rem;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .mini-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .mini-card {
      background: #12121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mini-card .m-cat-bar {
      height: 4px;
      width: 100%;
      background: var(--accent-color);
    }

    .mini-card .m-body {
      padding: 10px 5px;
      text-align: center;
    }

    .mini-card .m-icon {
      margin-bottom: 6px;
      color: var(--accent-color);
    }

    .mini-card .m-icon svg {
      width: 22px;
      height: 22px;
    }

    .mini-card .m-name {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .mini-card .m-desc {
      font-size: 0.65rem;
      opacity: 0.9;
      font-weight: 300;
      line-height: 1.2;
    }

    /* 색상 테마 */
    .c-0 {
      --accent-color: var(--accent1);
      color: var(--accent1);
    }

    .c-1 {
      --accent-color: var(--accent2);
      color: var(--accent2);
    }

    .c-2 {
      --accent-color: var(--accent3);
      color: var(--accent3);
    }

    .c-3 {
      --accent-color: var(--accent4);
      color: var(--accent4);
    }

    .c-4 {
      --accent-color: var(--accent5);
      color: var(--accent5);
    }

    .c-5 {
      --accent-color: var(--accent6);
      color: var(--accent6);
    }

    /* 모드 탭 */
    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mode-tab {
      background: transparent;
      border: 1px solid rgba(232, 201, 122, 0.25);
      color: rgba(240, 234, 214, 0.4);
      padding: 0.38rem 1.1rem;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 20px;
      transition: 0.2s;
    }

    .mode-tab.active {
      border-color: var(--accent1);
      color: var(--accent1);
      background: rgba(232, 201, 122, 0.08);
    }

    /* 장르 선택 */
    .genre-selector {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 600px;
      margin-bottom: 14px;
    }

    .genre-chip {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(240, 234, 214, 0.4);
      padding: 0.3rem 0.9rem;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 20px;
      transition: 0.2s;
    }

    /* 드래프트 바 */
    .draft-bar {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      min-height: 36px;
    }

    #draftCount {
      font-size: 0.85rem;
      opacity: 0.65;
    }

    .confirm-btn {
      display: none;
      background: transparent;
      border: 1.5px solid var(--accent2);
      color: var(--accent2);
      padding: 0.38rem 1.2rem;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      transition: 0.2s;
    }

    .confirm-btn:active {
      background: var(--accent2);
      color: var(--bg);
    }

    /* 드래프트 카드 선택 상태 */
    .draft-card {
      cursor: pointer;
      transition: transform 0.2s, opacity 0.35s;
    }

    .draft-card.draft-selected .card-inner {
      box-shadow: 0 0 0 2.5px var(--accent1), 0 0 18px rgba(232, 201, 122, 0.25);
      border-radius: 12px;
    }

    .draft-card.draft-dismissed {
      opacity: 0;
      transform: scale(0.88);
      pointer-events: none;
    }

    /* 카드 카운터 */
    .card-counter {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      opacity: 0.4;
      background: rgba(10, 10, 15, 0.85);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    /* 모바일 2,1 배치 */
    @media (max-width: 480px) {
      header h1 {
        font-size: 1.8rem;
      }

      .cards-area {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        justify-items: center;
      }

      .cards-area:not(.mode-draft) .card-wrap:nth-child(3) {
        grid-column: span 2;
      }

      .card-wrap {
        width: 145px;
        height: 225px;
      }

      .card-name {
        font-size: 1.1rem;
      }

      .card-desc {
        font-size: 0.68rem;
      }

      /* 드래프트: 3열 그리드 */
      .mode-draft {
        grid-template-columns: repeat(3, 1fr);
      }

      .mode-draft .card-wrap {
        width: 100%;
        height: 155px;
      }

      .mode-draft .card-name {
        font-size: 0.9rem;
      }

      .mode-draft .card-desc {
        font-size: 0.6rem;
      }

      .mini-card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>캐릭터 카드 뽑기</h1>
    <p>3장의 카드로 당신의 운명을 완성하세요</p>
  </header>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="basic" onclick="setMode('basic')">기본</button>
    <button class="mode-tab" data-mode="draft" onclick="setMode('draft')">드래프트</button>
    <button class="mode-tab" data-mode="random" onclick="setMode('random')">랜덤 6장</button>
    <button class="mode-tab" data-mode="random-draft" onclick="setMode('random-draft')">랜덤 드래프트</button>
    <button class="mode-tab" data-mode="genre" onclick="setMode('genre')">장르</button>
    <button class="mode-tab" data-mode="infinite" onclick="setMode('infinite')">무한</button>
  </div>

  <div class="genre-selector" id="genreSelector"></div>

  <div class="draft-bar" id="draftBar">
    <span id="draftCount"></span>
    <button class="confirm-btn" id="draftConfirm" onclick="confirmDraft()">선택 확정</button>
  </div>

  <button class="draw-btn" onclick="draw()">운명 뽑기</button>

  <main class="cards-area" id="cardsArea"></main>
  <div class="card-counter" id="cardCounter"></div>

  <button class="fab" onclick="toggleGuide()">?</button>

  <div class="guide-overlay" id="guideOverlay">
    <div class="guide-content">
      <div class="guide-header">
        <h2>전체 카드 도감</h2>
        <button class="close-btn" onclick="toggleGuide()"><i data-lucide="x"></i></button>
      </div>
      <div id="guideList"></div>
    </div>
  </div>

  <script>
    const CATEGORIES = [
      {
        name: "의상", desc: "캐릭터의 외형과 시대적 배경", colorIdx: 0, items: [
          { name: "교복", desc: "청춘의 상징", icon: "graduation-cap" }, { name: "갑옷", desc: "철벽 방어", icon: "shield" },
          { name: "정장", desc: "단정한 실루엣", icon: "briefcase" },
          { name: "코트", desc: "고독한 분위기", icon: "shirt" }, { name: "운동복", desc: "활동적인 에너지", icon: "dumbbell" },
          { name: "수영복", desc: "여름의 추억", icon: "droplets" }, { name: "로브", desc: "신비로운 마력", icon: "sparkles" },
          { name: "드레스", desc: "화려한 우아함", icon: "star" }, { name: "제복", desc: "규율과 질서", icon: "award" },
          { name: "모자", desc: "트레이드마크", icon: "hat" }, { name: "전신슈트", desc: "완벽한 밀착감", icon: "scan" }
        ]
      },
      {
        name: "전투방식", desc: "싸우는 스타일과 능력의 근원", colorIdx: 1, items: [
          { name: "검술", desc: "날카로운 베기", icon: "sword" }, { name: "격투", desc: "묵직한 타격", icon: "hand" },
          { name: "마법", desc: "신비한 영창", icon: "wand-2" }, { name: "소환", desc: "강력한 부름", icon: "dog" },
          { name: "암살", desc: "어둠 속 일격", icon: "moon" }, { name: "방어형", desc: "철벽의 가드", icon: "shield-alert" },
          { name: "치유형", desc: "빛의 회복", icon: "heart-pulse" }, { name: "기계병기", desc: "압도적 화력", icon: "bot" },
          { name: "신체변형", desc: "극한의 변화", icon: "dna" }, { name: "무기", desc: "강철의 힘", icon: "axe" },
          { name: "화기", desc: "폭발적 화력", icon: "target" }
        ]
      },
      {
        name: "장르", desc: "세계관의 전체적인 분위기", colorIdx: 2, items: [
          { name: "액션", desc: "폭발적 긴장감", icon: "zap" }, { name: "스포츠", desc: "땀과 열정", icon: "trophy" },
          { name: "공포", desc: "서늘한 공포", icon: "ghost" }, { name: "코믹", desc: "유쾌한 웃음", icon: "laugh" },
          { name: "로맨스", desc: "달콤한 설렘", icon: "heart" }, { name: "추리", desc: "진실의 추적", icon: "search" },
          { name: "판타지", desc: "꿈의 모험", icon: "mountain" }, { name: "일상", desc: "소소한 행복", icon: "coffee" },
          { name: "SF", desc: "미래의 상상", icon: "rocket" }, { name: "시대극", desc: "역사의 한 장면", icon: "scroll" },
          { name: "학원물", desc: "청춘의 이야기", icon: "book-open" }, { name: "이세계", desc: "또 다른 세계로", icon: "globe" }

          { name: "흰 머리카락", desc: "초월적 분위기", icon: "circle" }, { name: "붉은 눈", desc: "강렬한 시선", icon: "eye" },
          { name: "트윈테일", desc: "생기 넘치는 활기", icon: "git-fork" }, { name: "짧은 머리", desc: "시원한 인상", icon: "arrow-up" },
          { name: "긴 머리", desc: "우아하게 흐르는", icon: "arrow-down" }

          { name: "소심한", desc: "수줍은 마음", icon: "cloud" }, { name: "다정한", desc: "따뜻한 시선", icon: "sun" },
          { name: "까칠한", desc: "날카로운 말", icon: "zap" }, { name: "낯가리는", desc: "조심스러운 태도", icon: "eye-off" },
          { name: "장난꾸러기", desc: "즐거운 사고", icon: "party-popper" },
          { name: "집착하는", desc: "강한 집념", icon: "link" }, { name: "로맨틱한", desc: "낭만적 무드", icon: "rose" },
          { name: "냉정한", desc: "차가운 판단", icon: "snowflake" }, { name: "츤데레", desc: "숨겨진 진심", icon: "smile" },
          { name: "열혈", desc: "뜨거운 열정", icon: "activity" }, { name: "상냥한", desc: "따스한 배려", icon: "heart-handshake" },
          { name: "냉혈한", desc: "차가운 이성", icon: "thermometer" }, { name: "사차원", desc: "독특한 세계관", icon: "shuffle" }
        ]
      },
      {
        name: "특징", desc: "외형적 포인트와 상징적 개성", colorIdx: 5, items: [
          { name: "안경", desc: "지적 매력", icon: "glasses" }, { name: "문신", desc: "강렬한 표식", icon: "pen-tool" },
          { name: "흉터", desc: "전투의 흔적", icon: "scissors" },
          { name: "장신구", desc: "빛나는 개성", icon: "gem" }, { name: "가면", desc: "숨겨진 얼굴", icon: "mask" },
          { name: "이색 눈동자", desc: "신비로운 눈", icon: "eye" }, { name: "의수/의족", desc: "강철의 의지", icon: "armchair" },
          { name: "남성", desc: "남성적 외형", icon: "mars" }, { name: "여성", desc: "여성적 외형", icon: "venus" },
          { name: "노출", desc: "대담한 패션", icon: "wind" }, { name: "근육질", desc: "다져진 몸", icon: "dumbbell" },
          { name: "이종족", desc: "인간을 넘은 존재", icon: "paw-print" }, { name: "수염", desc: "남성미의 상징", icon: "align-justify" }
        ]
      }
    ];

    let catDecks = null;
    let currentMode = 'basic';
    let activeGenres = new Set();
    let draftState = { selected: new Set() };
    let infiniteTimer = null;

    function buildDecks() {
      catDecks = CATEGORIES.map(cat => ({
        cat,
        remaining: [...cat.items].sort(() => Math.random() - 0.5)
      }));
      activeGenres = new Set(CATEGORIES.map((_, i) => i));
    }

    function nextItem(deckEntry) {
      if (deckEntry.remaining.length === 0) {
        deckEntry.remaining = [...deckEntry.cat.items].sort(() => Math.random() - 0.5);
      }
      return deckEntry.remaining.pop();
    }

    function updateCounter() {
      const el = document.getElementById('cardCounter');
      if (!el || !catDecks) return;
      const rem = catDecks.reduce((s, d) => s + d.remaining.length, 0);
      const total = CATEGORIES.reduce((s, c) => s + c.items.length, 0);
      el.textContent = `남은 카드  ${rem} / ${total}`;
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.mode-tab[data-mode="${mode}"]`).classList.add('active');
      document.getElementById('genreSelector').style.display = mode === 'genre' ? 'flex' : 'none';
      document.getElementById('draftBar').style.display = (mode === 'draft' || mode === 'random-draft') ? 'flex' : 'none';
      if (infiniteTimer) { clearInterval(infiniteTimer); infiniteTimer = null; }
      draw();
    }

    function initGenreSelector() {
      const el = document.getElementById('genreSelector');
      el.innerHTML = CATEGORIES.map((cat, idx) =>
        `<button class="genre-chip" data-idx="${idx}" onclick="toggleGenre(${idx})">${cat.name}</button>`
      ).join('');
      CATEGORIES.forEach((_, idx) => updateGenreChip(idx));
    }

    function updateGenreChip(idx) {
      const chip = document.querySelector(`.genre-chip[data-idx="${idx}"]`);
      if (!chip) return;
      const isActive = activeGenres.has(idx);
      const colorVar = `var(--accent${CATEGORIES[idx].colorIdx + 1})`;
      chip.style.borderColor = isActive ? colorVar : 'rgba(255,255,255,0.15)';
      chip.style.color = isActive ? colorVar : 'rgba(240,234,214,0.4)';
      chip.style.background = isActive ? 'rgba(255,255,255,0.05)' : 'transparent';
    }

    function toggleGenre(idx) {
      if (activeGenres.has(idx)) {
        if (activeGenres.size <= 3) return;
        activeGenres.delete(idx);
      } else {
        activeGenres.add(idx);
      }
      updateGenreChip(idx);
    }

    function pickRandom6() {
      const catCounts = new Map();
      const results = [];
      while (results.length < 6) {
        const available = catDecks.filter((_, i) => (catCounts.get(i) || 0) < 3);
        if (available.length === 0) break;
        const deckEntry = available[Math.floor(Math.random() * available.length)];
        const catIdx = catDecks.indexOf(deckEntry);
        results.push({ cat: deckEntry.cat, item: nextItem(deckEntry), deckEntry });
        catCounts.set(catIdx, (catCounts.get(catIdx) || 0) + 1);
      }
      return results;
    }

    function pickDecks(count) {
      const pool = currentMode === 'genre'
        ? catDecks.filter((_, i) => activeGenres.has(i))
        : catDecks;
      return [...pool].sort(() => Math.random() - 0.5).slice(0, count);
    }

    function makeCardWrap(cat, item, idx) {
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';
      wrap.innerHTML = `
        <div class="card-inner" id="ci${idx}">
          <div class="card-face card-back"><span>?</span></div>
          <div class="card-face card-front" style="color:var(--accent${cat.colorIdx + 1})">
            <div class="cat-bar" style="background:var(--accent${cat.colorIdx + 1})"></div>
            <div class="card-body">
              <div class="card-cat-name">${cat.name}</div>
              <div style="margin-bottom:8px;"><i data-lucide="${item.icon}"></i></div>
              <div class="card-name">${item.name}</div>
              <div class="card-desc">${item.desc}</div>
            </div>
          </div>
        </div>
      `;
      return wrap;
    }

    function runInfiniteCycle() {
      const cardInners = document.querySelectorAll('#cardsArea .card-inner');
      if (cardInners.length === 0) return;

      cardInners.forEach(ci => ci.classList.remove('flipped'));

      setTimeout(() => {
        const decks = pickDecks(3);
        cardInners.forEach((ci, i) => {
          if (i >= decks.length) return;
          const deckEntry = decks[i];
          const item = nextItem(deckEntry);
          const cat = deckEntry.cat;
          const front = ci.querySelector('.card-front');
          front.style.color = `var(--accent${cat.colorIdx + 1})`;
          front.querySelector('.cat-bar').style.background = `var(--accent${cat.colorIdx + 1})`;
          front.querySelector('.card-cat-name').textContent = cat.name;
          front.querySelector('.card-name').textContent = item.name;
          front.querySelector('.card-desc').textContent = item.desc;
          const iconEl = front.querySelector('[data-lucide]');
          iconEl.setAttribute('data-lucide', item.icon);
          iconEl.innerHTML = '';
        });
        lucide.createIcons();
        setTimeout(() => cardInners.forEach(ci => ci.classList.add('flipped')), 100);
        updateCounter();
      }, 900);
    }

    function draw() {
      if (!catDecks) buildDecks();

      const area = document.getElementById('cardsArea');

      area.innerHTML = '';
      area.classList.remove('mode-draft');
      document.getElementById('draftConfirm').style.display = 'none';
      document.getElementById('draftCount').textContent = '';
      draftState = { selected: new Set(), cards: [] };

      if (currentMode === 'draft') {
        area.classList.add('mode-draft');
        document.getElementById('draftCount').textContent = '0 / 3 선택됨';
        pickDecks(Math.min(6, catDecks.length)).forEach((deckEntry, i) => {
          const item = nextItem(deckEntry);
          draftState.cards[i] = { deckEntry, item };
          const wrap = makeCardWrap(deckEntry.cat, item, i);
          wrap.classList.add('draft-card');
          wrap.dataset.idx = i;
          wrap.addEventListener('click', () => toggleDraftCard(i));
          area.appendChild(wrap);
          setTimeout(() => document.getElementById(`ci${i}`)?.classList.add('flipped'), 150 + i * 100);
        });
      } else if (currentMode === 'random') {
        area.classList.add('mode-draft');
        pickRandom6().forEach(({ cat, item }, i) => {
          const wrap = makeCardWrap(cat, item, i);
          area.appendChild(wrap);
          setTimeout(() => document.getElementById(`ci${i}`)?.classList.add('flipped'), 150 + i * 100);
        });
      } else if (currentMode === 'random-draft') {
        area.classList.add('mode-draft');
        document.getElementById('draftCount').textContent = '0 / 3 선택됨';
        pickRandom6().forEach(({ cat, item, deckEntry }, i) => {
          draftState.cards[i] = { deckEntry, item };
          const wrap = makeCardWrap(cat, item, i);
          wrap.classList.add('draft-card');
          wrap.dataset.idx = i;
          wrap.addEventListener('click', () => toggleDraftCard(i));
          area.appendChild(wrap);
          setTimeout(() => document.getElementById(`ci${i}`)?.classList.add('flipped'), 150 + i * 100);
        });
      } else if (currentMode === 'infinite') {
        pickDecks(3).forEach((deckEntry, i) => {
          const item = nextItem(deckEntry);
          const wrap = makeCardWrap(deckEntry.cat, item, i);
          area.appendChild(wrap);
          setTimeout(() => document.getElementById(`ci${i}`)?.classList.add('flipped'), 150 + i * 150);
        });
        infiniteTimer = setInterval(runInfiniteCycle, 2500);
      } else {
        pickDecks(3).forEach((deckEntry, i) => {
          const item = nextItem(deckEntry);
          const wrap = makeCardWrap(deckEntry.cat, item, i);
          area.appendChild(wrap);
          setTimeout(() => document.getElementById(`ci${i}`)?.classList.add('flipped'), 150 + i * 150);
        });
      }

      lucide.createIcons();
      updateCounter();
    }

    function toggleDraftCard(idx) {
      const wrap = document.querySelector(`.draft-card[data-idx="${idx}"]`);
      if (!wrap) return;

      if (draftState.selected.has(idx)) {
        draftState.selected.delete(idx);
        wrap.classList.remove('draft-selected');
      } else {
        if (draftState.selected.size >= 3) return;
        draftState.selected.add(idx);
        wrap.classList.add('draft-selected');
      }

      const count = draftState.selected.size;
      document.getElementById('draftCount').textContent = `${count} / 3 선택됨`;
      document.getElementById('draftConfirm').style.display = count === 3 ? 'block' : 'none';
    }

    function confirmDraft() {
      const area = document.getElementById('cardsArea');
      document.querySelectorAll('.draft-card').forEach(wrap => {
        const idx = parseInt(wrap.dataset.idx);
        if (!draftState.selected.has(idx)) {
          const cardData = draftState.cards[idx];
          if (cardData?.deckEntry) cardData.deckEntry.remaining.push(cardData.item);
          wrap.classList.add('draft-dismissed');
          setTimeout(() => wrap.remove(), 400);
        }
      });
      setTimeout(() => {
        area.classList.remove('mode-draft');
        document.querySelectorAll('.draft-card').forEach(w => w.classList.remove('draft-card'));
      }, 450);
      document.getElementById('draftConfirm').style.display = 'none';
      document.getElementById('draftCount').textContent = '선택 완료';
    }

    function toggleGuide() {
      const overlay = document.getElementById('guideOverlay');
      overlay.classList.toggle('active');
      document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : 'auto';
    }

    function initGuide() {
      const list = document.getElementById('guideList');
      list.innerHTML = CATEGORIES.map((cat, cIdx) => `
        <div class="guide-section c-${cIdx}">
          <div class="guide-section-title">
             <i data-lucide="sparkle" style="width:18px;"></i> ${cat.name}
          </div>
          <div class="guide-section-desc">${cat.desc}</div>
          <div class="mini-card-grid">
            ${cat.items.map(item => `
              <div class="mini-card">
                <div class="m-cat-bar"></div>
                <div class="m-body">
                  <div class="m-icon"><i data-lucide="${item.icon}"></i></div>
                  <div class="m-name">${item.name}</div>
                  <div class="m-desc">${item.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    window.onload = () => {
      buildDecks();
      initGuide();
      initGenreSelector();
      draw();
      lucide.createIcons();
    };
  </script>
</body>

</html>
