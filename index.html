<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>캐릭터 카드 뽑기</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Black+Han+Sans&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #1a1a2e;
      --accent1: #e8c97a;
      --accent2: #c96a8f;
      --accent3: #6a9fc9;
      --accent4: #8fc96a;
      --accent5: #c9906a;
      --accent6: #a06ac9;
      --text: #f0ead6;
      --border: rgba(232, 201, 122, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif KR', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0 10px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 1.5rem 1rem 1rem;
    }

    header h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.6;
      margin-top: 5px;
    }

    .draw-btn {
      background: transparent;
      border: 1.5px solid var(--accent1);
      color: var(--accent1);
      padding: 0.7rem 2rem;
      font-family: 'Black Han Sans', sans-serif;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      border-radius: 4px;
    }

    .draw-btn:active {
      background: var(--accent1);
      color: var(--bg);
    }

    .cards-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      width: 100%;
      max-width: 800px;
      padding-bottom: 4rem;
    }

    /* 카드 기본 스타일 */
    .card-wrap {
      perspective: 1000px;
      width: 180px;
      height: 280px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-back {
      background: var(--card-bg);
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .card-back span {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 3.5rem;
      color: var(--accent1);
      opacity: 0.3;
    }

    .card-front {
      transform: rotateY(180deg);
      background: #12121a;
      z-index: 1;
    }

    .cat-bar {
      height: 6px;
      width: 100%;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
    }

    .card-name {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 0.7rem;
      opacity: 0.7;
      word-break: keep-all;
    }

    /* 플로팅 버튼 (FAB) */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: var(--accent1);
      color: var(--bg);
      border: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.6rem;
    }

    /* 도감 오버레이 */
    .guide-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 10, 0.97);
      backdrop-filter: blur(15px);
      z-index: 200;
      display: none;
      padding: 20px;
      overflow-y: auto;
    }

    .guide-overlay.active {
      display: block;
    }

    .guide-content {
      max-width: 1100px;
      margin: 0 auto;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: transparent;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .guide-header h2 {
      font-family: 'Black Han Sans', sans-serif;
      color: var(--accent1);
      margin: 0;
      font-size: 1.5rem;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      cursor: pointer;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 미니 카드 그리드 */
    .guide-section {
      margin-bottom: 50px;
    }

    .guide-section-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.3rem;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guide-section-desc {
      opacity: 0.5;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }

    .mini-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .mini-card {
      background: #12121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mini-card .m-cat-bar {
      height: 4px;
      width: 100%;
      background: var(--accent-color);
    }

    .mini-card .m-body {
      padding: 10px 5px;
      text-align: center;
    }

    .mini-card .m-icon {
      margin-bottom: 6px;
      color: var(--accent-color);
    }

    .mini-card .m-icon svg {
      width: 22px;
      height: 22px;
    }

    .mini-card .m-name {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 0.85rem;
      margin-bottom: 3px;
      color: #fff;
    }

    .mini-card .m-desc {
      font-size: 0.6rem;
      opacity: 0.5;
      line-height: 1.1;
    }

    /* 색상 설정 */
    .c-0 {
      --accent-color: var(--accent1);
      color: var(--accent1);
    }

    .c-1 {
      --accent-color: var(--accent2);
      color: var(--accent2);
    }

    .c-2 {
      --accent-color: var(--accent3);
      color: var(--accent3);
    }

    .c-3 {
      --accent-color: var(--accent4);
      color: var(--accent4);
    }

    .c-4 {
      --accent-color: var(--accent5);
      color: var(--accent5);
    }

    .c-5 {
      --accent-color: var(--accent6);
      color: var(--accent6);
    }

    /* 📱 모바일 2,1 레이아웃 설정 */
    @media (max-width: 480px) {
      header h1 {
        font-size: 1.8rem;
      }

      .cards-area {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        justify-items: center;
      }

      /* 3번째 카드를 가운데로 (2열을 다 차지하게 함) */
      .card-wrap:nth-child(3) {
        grid-column: span 2;
      }

      /* 모바일에서 한 화면에 다 보이기 위해 카드 크기 축소 */
      .card-wrap {
        width: 145px;
        height: 220px;
      }

      .card-name {
        font-size: 1rem;
      }

      .card-desc {
        font-size: 0.65rem;
      }

      .mini-card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>캐릭터 카드 뽑기</h1>
    <p>3장의 카드로 당신의 운명을 완성하세요</p>
  </header>

  <button class="draw-btn" onclick="draw()">운명 뽑기</button>

  <main class="cards-area" id="cardsArea"></main>

  <button class="fab" onclick="toggleGuide()">?</button>

  <div class="guide-overlay" id="guideOverlay">
    <div class="guide-content">
      <div class="guide-header">
        <h2>전체 카드 도감</h2>
        <button class="close-btn" onclick="toggleGuide()"><i data-lucide="x"></i></button>
      </div>
      <div id="guideList"></div>
    </div>
  </div>

  <script>
    const CATEGORIES = [
      {
        name: "의상", desc: "캐릭터의 외형과 시대적 배경", colorIdx: 0, items: [
          { name: "교복", desc: "청춘의 상징", icon: "graduation-cap" }, { name: "갑옷", desc: "철벽 방어", icon: "shield" },
          { name: "정장", desc: "단정한 실루엣", icon: "briefcase" }, { name: "한복", desc: "전통의 미", icon: "flower" },
          { name: "코트", desc: "고독한 분위기", icon: "shirt" }, { name: "운동복", desc: "활동적인 에너지", icon: "dumbbell" },
          { name: "수영복", desc: "여름의 추억", icon: "droplets" }, { name: "로브", desc: "신비로운 마력", icon: "sparkles" },
          { name: "드레스", desc: "화려한 우아함", icon: "star" }, { name: "제복", desc: "규율과 질서", icon: "award" }
        ]
      },
      {
        name: "전투방식", desc: "싸우는 스타일과 능력의 근원", colorIdx: 1, items: [
          { name: "검술", desc: "날카로운 베기", icon: "sword" }, { name: "격투", desc: "묵직한 타격", icon: "hand" },
          { name: "마법", desc: "신비한 영창", icon: "wand-2" }, { name: "저격", desc: "정밀한 사격", icon: "crosshair" },
          { name: "소환", desc: "강력한 부름", icon: "dog" }, { name: "암살", desc: "어둠 속 일격", icon: "moon" },
          { name: "방어형", desc: "철벽의 가드", icon: "shield-alert" }, { name: "치유형", desc: "빛의 회복", icon: "heart-pulse" },
          { name: "독술", desc: "치명적인 한 방", icon: "skull" }, { name: "기계병기", desc: "압도적 화력", icon: "bot" }
        ]
      },
      {
        name: "장르", desc: "세계관의 전체적인 분위기", colorIdx: 2, items: [
          { name: "액션", desc: "폭발적 긴장감", icon: "zap" }, { name: "스포츠", desc: "땀과 열정", icon: "trophy" },
          { name: "공포", desc: "서늘한 공포", icon: "ghost" }, { name: "코믹", desc: "유쾌한 웃음", icon: "laugh" },
          { name: "로맨스", desc: "달콤한 설렘", icon: "heart" }, { name: "추리", desc: "진실의 추적", icon: "search" },
          { name: "판타지", desc: "꿈의 모험", icon: "mountain" }, { name: "일상", desc: "소소한 행복", icon: "coffee" },
          { name: "SF", desc: "미래의 상상", icon: "rocket" }, { name: "시대극", desc: "역사의 한 장면", icon: "scroll" }
        ]
      },
      {
        name: "스타일", desc: "캐릭터의 직업이나 특별한 소질", colorIdx: 3, items: [
          { name: "시인", desc: "감성적 문장", icon: "feather" }, { name: "화가", desc: "색채의 마법", icon: "palette" },
          { name: "요리사", desc: "맛의 향연", icon: "utensils" }, { name: "의사", desc: "생명의 구원", icon: "stethoscope" },
          { name: "과학자", desc: "진리의 탐구", icon: "microscope" }, { name: "발명가", desc: "무한한 창조", icon: "lightbulb" },
          { name: "아이돌", desc: "무대의 중심", icon: "mic-2" }, { name: "탐정", desc: "날카로운 눈초리", icon: "glasses" },
          { name: "음악가", desc: "영혼의 울림", icon: "music" }, { name: "기사", desc: "명예의 수호", icon: "shield-check" }
        ]
      },
      {
        name: "성격", desc: "내면의 기질과 행동의 동기", colorIdx: 4, items: [
          { name: "소심한", desc: "수줍은 마음", icon: "cloud" }, { name: "다정한", desc: "따뜻한 시선", icon: "sun" },
          { name: "까칠한", desc: "날카로운 말", icon: "zap" }, { name: "낯가리는", desc: "조심스러운 태도", icon: "eye-off" },
          { name: "장난꾸러기", desc: "즐거운 사고", icon: "party-popper" }, { name: "열정적인", desc: "뜨거운 에너지", icon: "fire" },
          { name: "집착하는", desc: "강한 집념", icon: "link" }, { name: "로맨틱한", desc: "낭만적 무드", icon: "rose" },
          { name: "냉정한", desc: "차가운 판단", icon: "snowflake" }, { name: "츤데레", desc: "숨겨진 진심", icon: "smile" }
        ]
      },
      {
        name: "특징", desc: "외형적 포인트와 상징적 개성", colorIdx: 5, items: [
          { name: "안경", desc: "지적 매력", icon: "glasses" }, { name: "문신", desc: "강렬한 표식", icon: "pen-tool" },
          { name: "흉터", desc: "전투의 흔적", icon: "scissors" }, { name: "반창고", desc: "소소한 상처", icon: "bandage" },
          { name: "귀걸이", desc: "빛나는 장식", icon: "circle" }, { name: "목걸이", desc: "소중한 펜던트", icon: "gem" },
          { name: "피어싱", desc: "개성적 감각", icon: "disc" }, { name: "가면", desc: "숨겨진 얼굴", icon: "mask" },
          { name: "이색 눈동자", desc: "신비로운 눈", icon: "eye" }, { name: "의수/의족", desc: "강철의 의지", icon: "armchair" }
        ]
      }
    ];

    function draw() {
      const area = document.getElementById('cardsArea');
      area.innerHTML = '';

      // 6개 중 3개 랜덤 선택
      const selectedCats = [...CATEGORIES]
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      selectedCats.forEach((cat, idx) => {
        const item = cat.items[Math.floor(Math.random() * cat.items.length)];
        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';
        wrap.innerHTML = `
          <div class="card-inner" id="ci${idx}">
            <div class="card-face card-back"><span>?</span></div>
            <div class="card-face card-front" style="color:var(--accent${cat.colorIdx + 1})">
              <div class="cat-bar" style="background:var(--accent${cat.colorIdx + 1})"></div>
              <div class="card-body">
                <div style="font-size:0.65rem; opacity:0.6; margin-bottom:5px;">${cat.name}</div>
                <div style="margin-bottom:8px;"><i data-lucide="${item.icon}"></i></div>
                <div class="card-name">${item.name}</div>
                <div class="card-desc">${item.desc}</div>
              </div>
            </div>
          </div>
        `;
        area.appendChild(wrap);
        // 뒤집기 애니메이션 시차
        setTimeout(() => {
          const el = document.getElementById(`ci${idx}`);
          if (el) el.classList.add('flipped');
        }, 150 + (idx * 150));
      });
      lucide.createIcons();
    }

    function toggleGuide() {
      const overlay = document.getElementById('guideOverlay');
      overlay.classList.toggle('active');
      document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : 'auto';
    }

    function initGuide() {
      const list = document.getElementById('guideList');
      list.innerHTML = CATEGORIES.map((cat, cIdx) => `
        <div class="guide-section c-${cIdx}">
          <div class="guide-section-title">
             <i data-lucide="sparkle" style="width:18px;"></i> ${cat.name}
          </div>
          <div class="guide-section-desc">${cat.desc}</div>
          <div class="mini-card-grid">
            ${cat.items.map(item => `
              <div class="mini-card">
                <div class="m-cat-bar"></div>
                <div class="m-body">
                  <div class="m-icon"><i data-lucide="${item.icon}"></i></div>
                  <div class="m-name">${item.name}</div>
                  <div class="m-desc">${item.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    window.onload = () => {
      initGuide();
      draw();
      lucide.createIcons();
    };
  </script>
</body>

</html>
